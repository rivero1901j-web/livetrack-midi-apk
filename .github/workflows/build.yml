name: Build LiveTrack MIDI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Universal MIDI Player APK
        run: |
          mkdir -p app/src/main/assets
          cp www/index.html app/src/main/assets/index.html
          mkdir -p app/src/main/java/com/livetrack/midi
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#121212" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#1565C0" android:pathData="M54,18 A36,36 0 1,1 53.9,18 Z" />
              <path android:fillColor="#121212" android:pathData="M54,24 A30,30 0 1,1 53.9,24 Z" />
              <path android:fillColor="#69F0AE" android:pathData="M45,38 L70,54 L45,70 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M42,82 m-3,0 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,84 m-3,0 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0" />
              <path android:fillColor="#FFFFFF" android:pathData="M66,82 m-3,0 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0" />
          </vector>
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LiveTrackMIDI"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.livetrack.midi'
              compileSdk 34
              defaultConfig {
                  applicationId "com.livetrack.midi"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.midi" android:required="false" />
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="LiveTrack MIDI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:keepScreenOn="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/livetrack/midi/MainActivity.kt
          package com.livetrack.midi

          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.media.midi.*
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.WindowManager
          import android.webkit.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private var midiManager: MidiManager? = null
              private var activeDevice: MidiDevice? = null
              private var outputPort: MidiOutputPort? = null

              private val fileChooserLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val results: Array<Uri>? = if (result.resultCode == RESULT_OK && result.data != null) {
                      val clipData = result.data?.clipData
                      if (clipData != null) {
                          Array(clipData.itemCount) { i -> clipData.getItemAt(i).uri }
                      } else {
                          result.data?.data?.let { arrayOf(it) }
                      }
                  } else null
                  filePathCallback?.onReceiveValue(results)
                  filePathCallback = null
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mediaPlaybackRequiresUserGesture = false
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          this@MainActivity.filePathCallback?.onReceiveValue(null)
                          this@MainActivity.filePathCallback = filePathCallback
                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "audio/*"
                              putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                          }
                          fileChooserLauncher.launch(Intent.createChooser(intent, "Seleccionar pistas"))
                          return true
                      }
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          setupMidi()
                      }
                  }

                  webView.loadUrl("file:///android_asset/index.html")
              }

              private fun setupMidi() {
                  midiManager = getSystemService(Context.MIDI_SERVICE) as? MidiManager
                  val manager = midiManager ?: return

                  manager.devices.firstOrNull { it.outputPortCount > 0 }?.let { openMidiDevice(it) }

                  manager.registerDeviceCallback(object : MidiManager.DeviceCallback() {
                      override fun onDeviceAdded(device: MidiDeviceInfo) {
                          if (device.outputPortCount > 0) openMidiDevice(device)
                      }
                      override fun onDeviceRemoved(device: MidiDeviceInfo) {
                          runOnUiThread {
                              webView.evaluateJavascript("window.onAndroidMidiDisconnected()", null)
                          }
                      }
                  }, Handler(Looper.getMainLooper()))
              }

              private fun openMidiDevice(deviceInfo: MidiDeviceInfo) {
                  val name = deviceInfo.properties.getString(MidiDeviceInfo.PROPERTY_NAME) ?: "Controlador MIDI"
                  midiManager?.openDevice(deviceInfo, { device ->
                      if (device != null) {
                          activeDevice = device
                          outputPort = device.openOutputPort(0)
                          outputPort?.connect(object : MidiReceiver() {
                              override fun onSend(msg: ByteArray, offset: Int, count: Int, timestamp: Long) {
                                  if (count >= 2) {
                                      val status = msg[offset].toInt() and 0xFF
                                      val d1 = msg[offset + 1].toInt() and 0xFF
                                      val d2 = if (count >= 3) msg[offset + 2].toInt() and 0xFF else 127
                                      runOnUiThread {
                                          webView.evaluateJavascript("window.onAndroidMidiMessage($status, $d1, $d2)", null)
                                      }
                                  }
                              }
                          })
                          runOnUiThread {
                              webView.evaluateJavascript("window.onAndroidMidiConnected('$name')", null)
                          }
                      }
                  }, Handler(Looper.getMainLooper()))
              }

              override fun onDestroy() {
                  outputPort?.close()
                  activeDevice?.close()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveTrackMIDI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
